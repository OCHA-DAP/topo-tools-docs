name: Scheduled vendored docs sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Update submodules
        id: update
        run: |
          git submodule update --remote vendor/topo-tools-py vendor/topo-tools-js
          if git diff --quiet -- vendor/topo-tools-py vendor/topo-tools-js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendor/topo-tools-py vendor/topo-tools-js
          git commit -m "Scheduled sync of vendored docs"
          git push
      - name: Trigger deploy
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
